name: Test basic gcloud usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gcloud version
        id: gcloud_version
        uses: .
        with:
          args: version
          cli: gcloud
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
          PROJECT_ID: fake-project-for-testing
      - name: Assert gcloud ran successfully
        run: |
          echo "gcloud version step completed successfully"
          echo "PASS"
