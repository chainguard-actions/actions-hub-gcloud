name: Test basic gcloud usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
      PROJECT_ID: test-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gcloud version
        id: gcloud-version
        uses: .
        with:
          args: version
          cli: gcloud
      - name: Assert gcloud ran successfully
        run: |
          echo "gcloud version step completed"
          echo "PASS"
