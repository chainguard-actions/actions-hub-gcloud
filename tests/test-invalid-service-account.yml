name: Test invalid service account credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          APPLICATION_CREDENTIALS: '{"type": "not-a-real-key"}'
          PROJECT_ID: actionchain-test-project
        with:
          args: info
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid service account key"
            exit 1
          fi
          echo "PASS"
