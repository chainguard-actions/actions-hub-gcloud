name: Test gcloud info command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gcloud info
        id: gcloud_info
        uses: .
        with:
          args: info
          cli: gcloud
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
          PROJECT_ID: fake-project-for-testing
      - name: Assert gcloud info ran successfully
        run: |
          echo "gcloud info step completed successfully"
          echo "PASS"
