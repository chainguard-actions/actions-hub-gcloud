name: Test gcloud info command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gcloud info
        id: action
        uses: .
        with:
          args: info
          cli: gcloud
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-info-check
          PROJECT_ID: test-project
      - name: Assert gcloud info ran successfully
        run: |
          echo "PASS: gcloud info ran successfully"
