name: Test gcloud - gsutil CLI selection fails gracefully without credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cli: gsutil
          args: version
        continue-on-error: true
      - name: Assert action failed gracefully (no credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no credentials are provided (gsutil)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
