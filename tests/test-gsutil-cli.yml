name: Test gsutil CLI selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: version
          cli: gsutil
        continue-on-error: true
      - name: Assert action fails gracefully without credentials when using gsutil
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (credentials may be pre-configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
