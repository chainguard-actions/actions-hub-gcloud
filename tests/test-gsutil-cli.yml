name: Test gcloud action - gsutil CLI selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run gsutil version command
        id: action
        uses: .
        with:
          args: version
          cli: gsutil
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-version-check
          PROJECT_ID: fake-project-id
        continue-on-error: true

      - name: Assert gsutil version ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: gsutil version command succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
