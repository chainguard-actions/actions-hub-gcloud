name: Test gcloud - access token auth path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
          PROJECT_ID: fake-project-for-testing
        with:
          args: version
      - name: Assert action attempted to run with access token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (if token is valid) or fail at the
          # gcloud command level (not at the credential setup level), since
          # CLOUDSDK_AUTH_ACCESS_TOKEN bypasses the credential file setup.
          # Either outcome is acceptable — we just verify it ran.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with access token path and failed at gcloud level (expected with fake token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
