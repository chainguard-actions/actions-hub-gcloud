name: Test access token auth path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: version
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-access-token-for-testing
          PROJECT_ID: test-project-123
        continue-on-error: true
      - name: Assert action ran (success or graceful failure with invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with access token auth path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid access token (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
