name: Test default CLI (gcloud)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
      PROJECT_ID: test-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gcloud version using default cli input
        id: gcloud-default
        uses: .
        with:
          args: version
      - name: Assert default cli ran successfully
        run: |
          echo "gcloud version step completed using default cli"
          echo "PASS"
