name: Test default CLI (gcloud) usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gcloud with default cli input
        id: gcloud_default
        uses: .
        with:
          args: version
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
          PROJECT_ID: fake-project-for-testing
      - name: Assert default cli ran successfully
        run: |
          echo "Default CLI (gcloud) version step completed successfully"
          echo "PASS"
