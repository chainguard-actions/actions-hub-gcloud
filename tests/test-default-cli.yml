name: Test default cli (gcloud) with --version flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
      PROJECT_ID: test-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: --version
      - name: Assert default gcloud cli ran successfully
        run: |
          echo "PASS: gcloud --version ran with default cli setting"
