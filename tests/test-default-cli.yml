name: Test default gcloud CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: version
        # cli input not specified, defaults to 'gcloud'
        continue-on-error: true
      - name: Assert action fails gracefully without credentials using default CLI
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without credentials, the entrypoint exits with error about missing APPLICATION_CREDENTIALS
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without credentials (default gcloud CLI)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (credentials may be pre-configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
