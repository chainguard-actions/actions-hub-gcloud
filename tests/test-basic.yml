name: Test basic usage with access token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-access-token-for-offline-test
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          PROJECT_ID: actionchain-test-project
        with:
          args: info
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
