name: Test gcloud - version command with default cli
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          args: version
          cli: gcloud
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: dummy-token-for-version-check
          PROJECT_ID: test-project
        continue-on-error: true

      - name: Assert action ran (version command or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: gcloud version command succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dummy token rejected or other expected error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
