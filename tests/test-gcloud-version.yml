name: Test gcloud - version command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: version
          cli: gcloud
        env:
          # Use a fake access token - gcloud version doesn't require real auth
          CLOUDSDK_AUTH_ACCESS_TOKEN: 'fake-token-for-testing'
          PROJECT_ID: 'fake-project-id'
      - name: Assert gcloud version ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: gcloud version command succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (expected with fake credentials in some environments)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
