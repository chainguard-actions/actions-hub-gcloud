name: Test gcloud version command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gcloud version
        id: action
        uses: .
        with:
          args: version
          cli: gcloud
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-version-check
          PROJECT_ID: test-project
      - name: Assert gcloud version output
        run: |
          echo "PASS: gcloud version ran successfully"
