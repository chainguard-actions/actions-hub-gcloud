name: Test access token auth with default gcloud info
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: dummy-gcp-access-token
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          PROJECT_ID: actionchain-test-project
        with:
          args: info
      - name: Assert action succeeded and added gcloud to PATH
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "PATH: $PATH"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          case "$PATH" in
            *google-cloud-sdk/bin*) echo "PASS: PATH updated" ;;
            *) echo "FAIL: /google-cloud-sdk/bin not added to PATH"; exit 1 ;;
          esac
