name: Test missing credentials falls back to previous session
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # With no APPLICATION_CREDENTIALS / access token, the entrypoint detects the
      # gcloud config baked into the image ("previous session") and still runs the
      # command. Local commands like `gcloud info` therefore succeed.
      - id: action
        uses: .
        continue-on-error: true
        env:
          PROJECT_ID: actionchain-test-project
        with:
          args: info
      - name: Assert action ran gcloud without explicit credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected 'gcloud info' to succeed using the previous-session fallback"
            exit 1
          fi
          echo "PASS"
