name: Test running without credentials (unauthenticated info)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          PROJECT_ID: actionchain-test-project
        with:
          args: info
      - name: Assert action succeeded without credentials and added SDK to PATH
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "PATH: $PATH"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected 'gcloud info' to succeed without credentials"
            exit 1
          fi
          case "$PATH" in
            *google-cloud-sdk/bin*) echo "PASS: SDK path added" ;;
            *) echo "FAIL: google-cloud-sdk/bin not added to PATH"; exit 1 ;;
          esac
