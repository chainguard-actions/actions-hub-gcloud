name: Test missing credentials fails on auth-required command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # With no credentials the entrypoint falls back to "previous session"
      # (none exists), so commands that do not need auth (e.g. `info`) succeed.
      # A command that requires an active account must fail.
      - id: action
        uses: .
        continue-on-error: true
        env:
          PROJECT_ID: test-project-id
        with:
          args: auth print-access-token
      - name: Assert auth-required command failed without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no credentials are provided"
            exit 1
          fi
          echo "PASS"
