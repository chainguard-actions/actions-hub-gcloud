name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: gcloud_no_creds
        uses: .
        with:
          args: version
          cli: gcloud
        continue-on-error: true
        # No APPLICATION_CREDENTIALS or CLOUDSDK_AUTH_ACCESS_TOKEN set

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.gcloud_no_creds.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without credentials"
