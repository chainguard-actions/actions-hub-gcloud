name: Test missing credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: version
        # No APPLICATION_CREDENTIALS or CLOUDSDK_AUTH_ACCESS_TOKEN set
        # The entrypoint should exit 1 with "APPLICATION_CREDENTIALS not found..."
      - name: Assert action failed gracefully due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no credentials are provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
