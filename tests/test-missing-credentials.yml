name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: gcloud-no-creds
        uses: .
        with:
          args: version
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK: "true"
        continue-on-error: true
      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.gcloud-no-creds.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail without credentials, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly did not succeed without credentials (outcome: $OUTCOME)"
