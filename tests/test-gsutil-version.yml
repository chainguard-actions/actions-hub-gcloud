name: Test gsutil cli version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-version-check
          PROJECT_ID: fake-project
        with:
          cli: gsutil
          args: version
      - name: Assert gsutil version ran successfully
        run: |
          echo "PASS: gsutil version step completed without error"
