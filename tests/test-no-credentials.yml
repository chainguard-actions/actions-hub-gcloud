name: Test gcloud - no credentials failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: version
        env:
          # No APPLICATION_CREDENTIALS or CLOUDSDK_AUTH_ACCESS_TOKEN set
          # No PROJECT_ID set
          # The action should exit 1 with an error message
          APPLICATION_CREDENTIALS: ''
      - name: Assert action failed gracefully without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no credentials provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
