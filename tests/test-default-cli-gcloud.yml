name: Test gcloud - default CLI is gcloud
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
          PROJECT_ID: fake-project-for-testing
        with:
          # No cli input — should default to 'gcloud'
          args: version
      - name: Assert action ran with default gcloud CLI
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token, gcloud version may still succeed (it's a local command)
          # or fail at auth. Either way the action should have attempted to run gcloud.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (default gcloud CLI) and failed gracefully with fake credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with default gcloud CLI"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
