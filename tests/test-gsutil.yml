name: Test gsutil CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
      PROJECT_ID: test-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gsutil version
        id: gsutil-version
        uses: .
        with:
          args: version
          cli: gsutil
      - name: Assert gsutil ran successfully
        run: |
          echo "gsutil version step completed"
          echo "PASS"
