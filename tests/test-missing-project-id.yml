name: Test missing PROJECT_ID error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: version
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
          # PROJECT_ID intentionally not set to trigger the error path
        continue-on-error: true
      - name: Assert action fails without PROJECT_ID
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The entrypoint exits with code 1 when PROJECT_ID is not set
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without PROJECT_ID"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (project may be pre-configured in gcloud config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
