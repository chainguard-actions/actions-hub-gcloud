name: Test failure when PROJECT_ID is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-access-token-for-offline-test
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        with:
          args: info
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when PROJECT_ID is not set"
            exit 1
          fi
          echo "PASS"
