name: Test missing PROJECT_ID error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: gcloud_no_project
        uses: .
        with:
          args: version
          cli: gcloud
        continue-on-error: true
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-project-check
          # No PROJECT_ID set

      - name: Assert action failed due to missing PROJECT_ID
        env:
          OUTCOME: ${{ steps.gcloud_no_project.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without PROJECT_ID, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without PROJECT_ID"
