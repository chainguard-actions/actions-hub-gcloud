name: Test missing PROJECT_ID error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: version
        env:
          # Provide a fake token so the credentials check passes,
          # but omit PROJECT_ID so the project check fails
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-testing
          # PROJECT_ID intentionally not set
      - name: Assert action failed due to missing PROJECT_ID
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when PROJECT_ID is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without PROJECT_ID"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
