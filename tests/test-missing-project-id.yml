name: Test missing PROJECT_ID error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without PROJECT_ID (should fail)
        id: no_project
        uses: .
        with:
          args: version
          cli: gcloud
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: fake-token-for-test
        continue-on-error: true
      - name: Assert action failed due to missing PROJECT_ID
        run: |
          echo "outcome: ${{ steps.no_project.outcome }}"
          if [ "${{ steps.no_project.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when PROJECT_ID is not provided, but got: ${{ steps.no_project.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when PROJECT_ID was missing"
