name: Test gcloud - missing project ID failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: version
        env:
          # Provide a fake access token so credentials check passes
          CLOUDSDK_AUTH_ACCESS_TOKEN: 'fake-token-for-testing'
          # Intentionally omit PROJECT_ID so the action should fail
      - name: Assert action failed gracefully without project ID
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when PROJECT_ID is not provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without PROJECT_ID"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
